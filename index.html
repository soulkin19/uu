<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>プロスピ風 球種マップ作成</title>
    <style>
        :root {
            --bg-color: #222;
            --panel-bg: rgba(40, 40, 40, 0.9);
            --text-color: #fff;
            --border-color: #555;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'sans-serif';
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* チャートエリア */
        .chart-viewport {
            position: relative;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #444 0%, #111 100%);
            border: 2px solid #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* 中央のボール */
        .center-ball {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            border: 2px solid #333;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        /* 変化の矢印とゲージのコンテナ */
        .pitch-line {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: 0 50%;
            height: 20px;
            display: flex;
            align-items: center;
            pointer-events: none;
        }

        /* ゲージのドット */
        .dot {
            width: 8px;
            height: 12px;
            margin-right: 2px;
            background: #444; /* デフォルト（未変化） */
            border: 1px solid #000;
        }

        /* ランクに応じた色（例：Dはオレンジ、Fは青など） */
        .dot.active { background: #ff9933; box-shadow: 0 0 5px #ff9933; }
        .dot.active.blue { background: #3399ff; box-shadow: 0 0 5px #3399ff; }

        /* ラベル（球種名と速度） */
        .pitch-label {
            position: absolute;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 4px;
            text-align: center;
            min-width: 80px;
            z-index: 20;
        }

        .pitch-name { font-weight: bold; font-size: 14px; display: block; }
        .pitch-speed { font-size: 12px; color: #ddd; }

        /* 入力フォーム */
        .controls {
            margin-top: 20px;
            background: #333;
            padding: 15px;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        input, select, button {
            padding: 5px;
            border-radius: 4px;
            border: none;
        }

        button {
            background: #ffcc00;
            font-weight: bold;
            cursor: pointer;
            grid-column: span 2;
        }
    </style>
</head>
<body>

    <div class="chart-viewport" id="viewport">
        <div class="center-ball">⚾</div>
        </div>

    <div class="controls">
        <input type="text" id="p-name" placeholder="球種名（例：カットボール）">
        <input type="number" id="p-speed" placeholder="球速 (km/h)">
        <select id="p-angle">
            <option value="0">右（シュート系）</option>
            <option value="45">右下（シンカー系）</option>
            <option value="90">下（フォーク系）</option>
            <option value="135">左下（カーブ系）</option>
            <option value="180">左（スライダー系）</option>
            <option value="270">上（ライズ系）</option>
        </select>
        <select id="p-level">
            <option value="3">変化量：小</option>
            <option value="5">変化量：中</option>
            <option value="8">変化量：大</option>
        </select>
        <button onclick="addPitch()">球種を追加</button>
    </div>

    <script>
        function addPitch() {
            const name = document.getElementById('p-name').value;
            const speed = document.getElementById('p-speed').value;
            const angle = document.getElementById('p-angle').value;
            const level = document.getElementById('p-level').value;
            const viewport = document.getElementById('viewport');

            if(!name) return;

            // コンテナ作成
            const line = document.createElement('div');
            line.className = 'pitch-line';
            line.style.transform = `rotate(${angle}deg) translate(25px, -50%)`;

            // ゲージ（ドット）の生成
            for (let i = 0; i < 10; i++) {
                const dot = document.createElement('div');
                dot.className = i < level ? 'dot active' : 'dot';
                // 角度が135度付近（カーブ系）なら青色にする遊び心
                if(angle == 135 && i < level) dot.classList.add('blue');
                line.appendChild(dot);
            }

            // ラベルの配置計算
            const label = document.createElement('div');
            label.className = 'pitch-label';
            const radius = 100 + (level * 5); // 変化量に応じて外側に配置
            const rad = (angle * Math.PI) / 180;
            const x = 200 + Math.cos(rad) * radius - 50;
            const y = 200 + Math.sin(rad) * radius - 20;

            label.style.left = `${x}px`;
            label.style.top = `${y}px`;
            label.innerHTML = `<span class="pitch-name">${name}</span><span class="pitch-speed">${speed} km/h</span>`;

            viewport.appendChild(line);
            viewport.appendChild(label);
        }
    </script>
</body>
</html>
