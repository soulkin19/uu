<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Nights at Freddy's - HTML Remake</title>
    <style>
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 1024px;
            height: 768px;
            margin: 20px auto;
            border: 4px solid #333;
            background: #111;
            overflow: hidden;
        }

        /* UI Elements */
        #ui-top-right {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
            font-size: 24px;
            z-index: 10;
        }

        #ui-bottom-left {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 20px;
            z-index: 10;
        }

        /* Office View */
        #office {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
            box-sizing: border-box;
            background: radial-gradient(circle, #222 0%, #050505 100%);
            transition: background 0.1s;
        }

        .door-control {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            background: #444;
            color: #fff;
            border: 2px solid #666;
            padding: 15px 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        .btn:active { background: #222; }
        .btn.active-door { background: #900; border-color: #f00; }
        .btn.active-light { background: #990; border-color: #ff0; }

        .door-visual {
            width: 60px;
            height: 80%;
            background: #333;
            border: 2px solid #555;
            transition: transform 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .door-visual.closed {
            transform: translateY(0);
            background: #555;
        }
        .door-visual.open {
            transform: translateY(-90%);
        }

        /* Monitor System */
        #monitor-toggle {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border: 2px solid #fff;
            color: #fff;
            text-align: center;
            line-height: 40px;
            cursor: pointer;
            z-index: 20;
            font-weight: bold;
        }
        #monitor-toggle:hover { background: rgba(255,255,255,0.4); }

        #camera-feed {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 15;
        }
        #camera-view {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            text-shadow: 0 0 10px #fff;
        }
        .static-effect {
            position: absolute;
            top:0; left:0; width:100%; height:100%;
            background: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.15"/%3E%3C/svg%3E');
            pointer-events: none;
        }

        #cam-map {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 250px;
            height: 200px;
            border: 2px solid #fff;
            background: rgba(0,0,0,0.8);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 10px;
        }
        .cam-btn {
            background: #222;
            color: #fff;
            border: 1px solid #fff;
            cursor: pointer;
            font-size: 14px;
        }
        .cam-btn.active {
            background: #0a0;
        }

        /* Screen States */
        .screen {
            display: none;
            position: absolute;
            top:0; left:0; width:100%; height:100%;
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #jumpscare-screen { background: #000; color: #f00; font-size: 60px; font-weight: bold; }
        #win-screen { background: #000; color: #0f0; font-size: 60px; font-weight: bold; }
        #blackout-screen { background: #000; }

        /* Office visual changes based on light */
        .light-on-left { background: radial-gradient(circle at 20% 50%, #555 0%, #050505 100%) !important; }
        .light-on-right { background: radial-gradient(circle at 80% 50%, #555 0%, #050505 100%) !important; }
        .light-on-both { background: radial-gradient(circle, #555 0%, #050505 100%) !important; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-top-right">
        <div id="clock">12 AM</div>
        <div id="day">Night 1</div>
    </div>
    <div id="ui-bottom-left">
        <div>Power Left: <span id="power-display">100</span>%</div>
        <div>Usage: <span id="usage-display">■</span></div>
    </div>

    <div id="office">
        <div class="door-control">
            <button class="btn" id="btn-left-door">DOOR</button>
            <button class="btn" id="btn-left-light">LIGHT</button>
        </div>
        
        <div class="door-visual open" id="door-left">DOOR</div>
        
        <div style="text-align: center; color: #444;">
            <h2>SECURITY ROOM</h2>
            <p id="office-alert" style="color: red; height: 20px; font-weight: bold;"></p>
        </div>
        
        <div class="door-visual open" id="door-right">DOOR</div>

        <div class="door-control">
            <button class="btn" id="btn-right-door">DOOR</button>
            <button class="btn" id="btn-right-light">LIGHT</button>
        </div>
    </div>

    <div id="camera-feed">
        <div class="static-effect"></div>
        <div id="camera-view">CAM 1A - SHOW STAGE</div>
        <div id="cam-map">
            <button class="cam-btn active" onclick="switchCam('1A')">CAM 1A</button>
            <button class="cam-btn" onclick="switchCam('1B')">CAM 1B</button>
            <button class="cam-btn" onclick="switchCam('2A')">CAM 2A</button>
            <button class="cam-btn" onclick="switchCam('2B')">CAM 2B</button>
        </div>
    </div>

    <div id="monitor-toggle">▼ MONITOR ▼</div>

    <div id="jumpscare-screen" class="screen">
        <div id="scare-creature">🐻 ITS ME 🐻</div>
        <div style="font-size: 20px; margin-top: 20px; color: #aaa;">GAME OVER</div>
        <button class="btn" style="margin-top:20px;" onclick="location.reload()">RETRY</button>
    </div>
    
    <div id="win-screen" class="screen">
        <div>6:00 AM</div>
        <div style="font-size: 20px; margin-top: 20px; color: #aaa;">5th Night Cleared</div>
        <button class="btn" style="margin-top:20px;" onclick="location.reload()">PLAY AGAIN</button>
    </div>

    <div id="blackout-screen" class="screen">
        <div style="color: #333; font-size: 24px;">......</div>
    </div>
</div>

<script>
    // Game States
    let power = 100;
    let hour = 0; // 0 = 12 AM, 1 = 1 AM ... 6 = 6 AM
    let isMonitorOpen = false;
    let currentCam = '1A';
    
    let leftDoorClosed = false;
    let rightDoorClosed = false;
    let leftLightOn = false;
    let rightLightOn = false;

    // Animatronic AI (Bonnie & Chica simplified into locations)
    // Locations: '1A'(Stage), '1B'(Dining), '2A'(Left Hall), '2B'(Right Hall), 'LeftDoor', 'RightDoor', 'Inside'
    let bonnie = { name: 'Bonnie (🐰)', loc: '1A', side: 'left' };
    let chica = { name: 'Chica (🐥)', loc: '1A', side: 'right' };

    // Game loops
    let gameInterval;
    let aiInterval;

    // DOM Elements
    const powerDisp = document.getElementById('power-display');
    const usageDisp = document.getElementById('usage-display');
    const clockDisp = document.getElementById('clock');
    const office = document.getElementById('office');
    const cameraFeed = document.getElementById('camera-feed');
    const cameraView = document.getElementById('camera-view');
    const monitorToggle = document.getElementById('monitor-toggle');
    const officeAlert = document.getElementById('office-alert');

    // Init
    function startGame() {
        gameInterval = setInterval(updateTimeAndPower, 40000); // 1時間 = 40秒 (全クリア約4分)
        setInterval(drainPowerTick, 1000); // 毎秒の電力消費
        aiInterval = setInterval(moveAI, 4500); // 4.5秒ごとにAIが移動判定
    }

    // Power Calculation
    function getUsage() {
        let usage = 1; // 基本消費
        if (leftDoorClosed) usage++;
        if (rightDoorClosed) usage++;
        if (leftLightOn) usage++;
        if (rightLightOn) usage++;
        if (isMonitorOpen) usage++;
        return usage;
    }

    function drainPowerTick() {
        if (power <= 0) return;
        
        let usage = getUsage();
        // UI Usage Bars
        usageDisp.innerHTML = '■'.repeat(usage);

        power -= (usage * 0.15); // 消費倍率
        if (power <= 0) {
            power = 0;
            triggerBlackout();
        }
        powerDisp.innerText = Math.floor(power);
    }

    function updateTimeAndPower() {
        hour++;
        if (hour === 6) {
            triggerWin();
        } else {
            clockDisp.innerText = hour + " AM";
        }
    }

    // Door & Light Actions
    document.getElementById('btn-left-door').addEventListener('click', function() {
        if(power <= 0) return;
        leftDoorClosed = !leftDoorClosed;
        this.classList.toggle('active-door', leftDoorClosed);
        document.getElementById('door-left').className = leftDoorClosed ? 'door-visual closed' : 'door-visual open';
    });

    document.getElementById('btn-right-door').addEventListener('click', function() {
        if(power <= 0) return;
        rightDoorClosed = !rightDoorClosed;
        this.classList.toggle('active-door', rightDoorClosed);
        document.getElementById('door-right').className = rightDoorClosed ? 'door-visual closed' : 'door-visual open';
    });

    document.getElementById('btn-left-light').addEventListener('click', function() {
        if(power <= 0) return;
        leftLightOn = !leftLightOn;
        if(leftLightOn) rightLightOn = false; // 簡易化のため片方ずつ
        document.getElementById('btn-right-light').classList.remove('active-light');
        this.classList.toggle('active-light', leftLightOn);
        updateOfficeLighting();
    });

    document.getElementById('btn-right-light').addEventListener('click', function() {
        if(power <= 0) return;
        rightLightOn = !rightLightOn;
        if(rightLightOn) leftLightOn = false;
        document.getElementById('btn-left-light').classList.remove('active-light');
        this.classList.toggle('active-light', rightLightOn);
        updateOfficeLighting();
    });

    function updateOfficeLighting() {
        office.className = '';
        if (leftLightOn && rightLightOn) office.classList.add('light-on-both');
        else if (leftLightOn) office.classList.add('light-on-left');
        else if (rightLightOn) office.classList.add('light-on-right');
        
        // ライトによるドア影の視認
        if (leftLightOn && bonnie.loc === 'LeftDoor') {
            officeAlert.innerText = "🐰 BONNIE IS AT THE LEFT WINDOW!!";
        } else if (rightLightOn && chica.loc === 'RightDoor') {
            officeAlert.innerText = "🐥 CHICA IS AT THE RIGHT WINDOW!!";
        } else {
            officeAlert.innerText = "";
        }
    }

    // Monitor Toggle
    monitorToggle.addEventListener('click', function() {
        if(power <= 0) return;
        isMonitorOpen = !isMonitorOpen;
        if (isMonitorOpen) {
            cameraFeed.style.display = 'block';
            this.innerText = '▲ CLOSE MONITOR ▲';
            renderCamFeed();
        } else {
            cameraFeed.style.display = 'none';
            this.innerText = '▼ MONITOR ▼';
        }
    });

    function switchCam(camId) {
        currentCam = camId;
        document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        renderCamFeed();
    }

    function renderCamFeed() {
        let text = `CAM ${currentCam}<br>`;
        let entities = [];
        if (bonnie.loc === currentCam) entities.push(bonnie.name);
        if (chica.loc === currentCam) entities.push(chica.name);

        if (currentCam === '1A') {
            text += "【STAGE】<br>";
            text += entities.length > 0 ? `Show Stage: ${entities.join(' ')}` : "Show Stage: (EMPTY)";
        } else if (currentCam === '1B') {
            text += "【DINING AREA】<br>";
            text += entities.length > 0 ? `Dining: ${entities.join(' ')}` : "Dining: Clean Tables";
        } else if (currentCam === '2A') {
            text += "【WEST HALL (LEFT)】<br>";
            text += entities.length > 0 ? `Hallway: ${entities.join(' ')}` : "Hallway: Dark Corridor";
        } else if (currentCam === '2B') {
            text += "【EAST HALL (RIGHT)】<br>";
            text += entities.length > 0 ? `Hallway: ${entities.join(' ')}` : "Hallway: Dark Corridor";
        }
        cameraView.innerHTML = text;
    }

    // AI Logic (Movement)
    function moveAI() {
        if (power <= 0) return;

        // --- Bonnie (Left Side) ---
        if (bonnie.loc === '1A' && Math.random() > 0.4) {
            bonnie.loc = '1B';
        } else if (bonnie.loc === '1B' && Math.random() > 0.4) {
            bonnie.loc = '2A';
        } else if (bonnie.loc === '2A' && Math.random() > 0.4) {
            bonnie.loc = 'LeftDoor';
            updateOfficeLighting();
        } else if (bonnie.loc === 'LeftDoor') {
            if (leftDoorClosed) {
                // ドアが閉まっていれば撤退
                bonnie.loc = '1A';
                updateOfficeLighting();
            } else if (!isMonitorOpen) {
                // ドアが開いていて、モニターを見ていなければ部屋に侵入
                bonnie.loc = 'Inside';
                setTimeout(triggerJumpscare, 2000, '🐰 BONNIE 🐰');
            }
        }

        // --- Chica (Right Side) ---
        if (chica.loc === '1A' && Math.random() > 0.5) {
            chica.loc = '1B';
        } else if (chica.loc === '1B' && Math.random() > 0.5) {
            chica.loc = '2B';
        } else if (chica.loc === '2B' && Math.random() > 0.5) {
            chica.loc = 'RightDoor';
            updateOfficeLighting();
        } else if (chica.loc === 'RightDoor') {
            if (rightDoorClosed) {
                // ドアが閉まっていれば撤退
                chica.loc = '1A';
                updateOfficeLighting();
            } else if (!isMonitorOpen) {
                // 部屋に侵入
                chica.loc = 'Inside';
                setTimeout(triggerJumpscare, 2000, '🐥 CHICA 🐥');
            }
        }

        if (isMonitorOpen) renderCamFeed();
    }

    // Game End States
    function triggerJumpscare(creature) {
        if (hour === 6 || winScreenTriggered) return;
        document.getElementById('scare-creature').innerText = creature;
        document.getElementById('jumpscare-screen').style.display = 'flex';
        clearIntervals();
    }

    let winScreenTriggered = false;
    function triggerWin() {
        winScreenTriggered = true;
        document.getElementById('win-screen').style.display = 'flex';
        clearIntervals();
    }

    function triggerBlackout() {
        clearIntervals();
        cameraFeed.style.display = 'none';
        monitorToggle.style.display = 'none';
        document.getElementById('blackout-screen').style.display = 'flex';
        
        // 停電後、数秒後にランダムでフレディが襲撃
        setTimeout(() => {
            triggerJumpscare('🐻 FREDDY (⚡BLACKOUT) 🐻');
        }, 3000 + Math.random() * 4000);
    }

    function clearIntervals() {
        clearInterval(gameInterval);
        clearInterval(aiInterval);
    }

    // Start
    startGame();
</script>

</body>
</html>
