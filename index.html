<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>本格3D野球ゲーム - ベースシステム</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        #ui-layer {
            position: absolute; top: 10px; left: 10px;
            color: white; font-family: sans-serif; font-size: 24px;
            text-shadow: 2px 2px 2px black; pointer-events: none;
        }
        #swing-btn {
            position: absolute; bottom: 20px; right: 20px;
            padding: 20px 40px; font-size: 20px; font-weight: bold;
            background: rgba(255,0,0,0.7); color: white;
            border: none; border-radius: 10px; cursor: pointer;
            /* iPadなどのタッチデバイスでも操作しやすいように配置 */
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui-layer">
        <div>判定: <span id="result">待機中</span></div>
        <div>球速: 150 km/h</div>
    </div>
    <button id="swing-btn">スイング (Spaceキー)</button>

    <script>
        // 1. シーン、カメラ、レンダラーのセットアップ
        const scene = new THREE.Scene();
        // プロスピ風のバッター後方視点
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.5, 3); // ホームベース(0,0,0)の少し後ろ・上
        camera.lookAt(0, 1, -18.44); // マウンドのピッチャー方向を見る

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. オブジェクトの作成
        // グラウンド
        const groundGeo = new THREE.PlaneGeometry(50, 50);
        const groundMat = new THREE.MeshBasicMaterial({ color: 0x228B22 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // ホームベース
        const baseGeo = new THREE.PlaneGeometry(0.43, 0.43);
        const baseMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const homeBase = new THREE.Mesh(baseGeo, baseMat);
        homeBase.rotation.x = -Math.PI / 2;
        homeBase.position.y = 0.01;
        scene.add(homeBase);

        // ピッチャー（仮の青い箱）
        const pitcherGeo = new THREE.BoxGeometry(0.5, 1.8, 0.5);
        const pitcherMat = new THREE.MeshBasicMaterial({ color: 0x0000ff });
        const pitcher = new THREE.Mesh(pitcherGeo, pitcherMat);
        pitcher.position.set(0, 0.9, -18.44); // マウンドの距離
        scene.add(pitcher);

        // ボール
        const ballGeo = new THREE.SphereGeometry(0.073, 16, 16); // 実際の野球ボールのサイズ比率
        const ballMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const ball = new THREE.Mesh(ballGeo, ballMat);
        scene.add(ball);

        // 3. ゲームのステータス管理
        let isPitching = false;
        let ballSpeedZ = 0;
        const resultText = document.getElementById('result');

        // 投球開始関数
        function pitch() {
            ball.position.set(0, 1.2, -18.44); // ピッチャーのリリースポイント
            isPitching = true;
            // 150km/h = 約41.6m/s。60fpsで割ると1フレーム約0.7m進む
            ballSpeedZ = 0.7; 
            resultText.innerText = "投球中...";
        }

        // スイング処理（打撃判定）
        function swing() {
            if (!isPitching) return;
            
            // Z座標（奥行き）でタイミングを判定
            // ホームベース上(z=0)周辺をジャストミートとする
            const timing = ball.position.z;

            if (timing > -0.5 && timing < 0.5) {
                resultText.innerText = "💥 ジャストミート！";
                resultText.style.color = "yellow";
                // 簡易的な打球の表現（手前に弾き返す）
                ballSpeedZ = -1.0; 
                ball.position.y += 0.5; // 少し浮かせる
            } else if (timing > -1.5 && timing <= -0.5) {
                resultText.innerText = "早すぎ！ (ファウル)";
                resultText.style.color = "orange";
            } else if (timing >= 0.5 && timing < 1.5) {
                resultText.innerText = "遅すぎ！ (ファウル)";
                resultText.style.color = "orange";
            } else {
                resultText.innerText = "空振り！";
                resultText.style.color = "red";
            }
        }

        // 4. イベントリスナー（キーボード＆タッチ対応）
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') swing();
        });
        document.getElementById('swing-btn').addEventListener('pointerdown', (e) => {
            e.preventDefault(); // スマホ/iPadでの余計なズームを防ぐ
            swing();
        });

        // 定期的に投球を繰り返す
        setInterval(() => {
            if (ball.position.z > 5 || ball.position.z < -20) {
                pitch();
            }
        }, 3000);

        // 5. アニメーションループ
        function animate() {
            requestAnimationFrame(animate);

            if (isPitching) {
                // ボールを移動
                ball.position.z += ballSpeedZ;
                
                // キャッチャーミット（画面手前）を通り過ぎたら
                if (ballSpeedZ > 0 && ball.position.z > 3) {
                    isPitching = false;
                    if(resultText.innerText === "投球中...") {
                        resultText.innerText = "見逃し";
                        resultText.style.color = "white";
                    }
                }
            }
            renderer.render(scene, camera);
        }

        // ウィンドウリサイズ対応
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ゲーム開始
        pitch();
        animate();
    </script>
</body>
</html>
